<script type="text/javascript">
(function () {
    function promptImportMode() {
        const answer = window.prompt('Import mode: type "append" to append or "replace" to replace existing presets.', 'append');
        if (!answer) {
            return null;
        }
        const mode = answer.trim().toLowerCase();
        return mode === 'replace' ? 'replace' : mode === 'append' ? 'append' : null;
    }

    function readJsonFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const parsed = JSON.parse(reader.result);
                    if (!Array.isArray(parsed)) {
                        reject(new Error('Expected a JSON array'));
                        return;
                    }
                    resolve(parsed);
                } catch (error) {
                    reject(error);
                }
            };
            reader.onerror = () => reject(new Error('Failed to read file'));
            reader.readAsText(file);
        });
    }

    function downloadJsonFile(filename, data) {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    function handleImport(input, currentItems, onLoaded) {
        const file = input.files && input.files[0];
        if (!file) {
            return;
        }
        readJsonFile(file).then((parsed) => {
            const mode = promptImportMode();
            if (!mode) {
                RED.notify('Import cancelled', 'warning');
                input.value = '';
                return;
            }
            const next = mode === 'replace' ? parsed : [...currentItems(), ...parsed];
            onLoaded(next, parsed.length);
            input.value = '';
        }).catch((error) => {
            RED.notify(`Import failed: ${error.message}`, 'error');
            input.value = '';
        });
    }

    function updateMessageContainer(container, messages) {
        container.empty();
        messages.forEach((message) => container.append(createMessageEditor(message)));
    }

    function createMessageEditor(message) {
        const row = $('<div/>', { class: 'noxy-message-row', style: 'border:1px solid #ccc;border-radius:6px;padding:10px;margin-bottom:8px;background:#fff;' });
        const line1 = $('<div/>', { style: 'display:flex;gap:8px;align-items:center;margin-bottom:6px;' }).appendTo(row);
        $('<input/>', { class: 'node-input-message-name', type: 'text', placeholder: 'Message name', style: 'flex:1;' }).val(message?.name || message?.eventName || '').appendTo(line1);
        $('<input/>', { class: 'node-input-message-shortref', type: 'text', placeholder: 'Short ref', style: 'width:140px;' }).val(message?.shortRef || '').appendTo(line1);
        $('<select/>', { class: 'node-input-message-flag', style: 'width:160px;' })
            .append('<option value="">No prefix</option>')
            .append('<option value="event">/event</option>')
            .append('<option value="story">/story</option>')
            .append('<option value="note">/note</option>')
            .append('<option value="secret">/secret</option>')
            .append('<option value="instruction">/instruction</option>')
            .append('<option value="noreply">/noreply</option>')
            .append('<option value="setflags">/setflags</option>')
            .append('<option value="repeat">/repeat</option>')
            .val(message?.flag || '')
            .appendTo(line1);
        $('<button/>', { type: 'button', class: 'red-ui-button red-ui-button-small node-input-message-remove' }).text('Remove').appendTo(line1);

        $('<textarea/>', { class: 'node-input-message-content', placeholder: 'Message text', style: 'width:100%;min-height:64px;margin-bottom:6px;' })
            .val(message?.content || '')
            .appendTo(row);
        $('<input/>', { class: 'node-input-message-additional', type: 'text', placeholder: 'Additional refs, comma separated', style: 'width:100%;' })
            .val(Array.isArray(message?.additionalMessages) ? message.additionalMessages.join(', ') : '')
            .appendTo(row);

        row.on('click', '.node-input-message-remove', function () { row.remove(); });
        return row;
    }

    const voxtaMessagesDefinition = {
        category: 'Voxta',
        color: '#f6f7fb',
        defaults: {
            name: { value: '' },
            client: {
                value: '',
                type: 'signalr-client',
                required: true,
                validate: function (value) { return RED.nodes.node(value) != null; }
            },
            sessionId: { value: '' },
            text: { value: '' },
            forwardUnmatched: { value: true },
            messages: { value: [] }
        },
        inputs: 1,
        outputs: 1,
        icon: 'voxta.png',
        label: function () {
            return this.name || 'voxta-messages';
        },
        oneditprepare: function () {
            const container = $('#node-input-messages-container');
            updateMessageContainer(container, Array.isArray(this.messages) ? this.messages : []);
            $('#node-input-add-message').off('click').on('click', function () {
                container.append(createMessageEditor());
            });
            $('#node-input-export-messages').off('click').on('click', () => {
                downloadJsonFile('voxta-messages.json', this.messages || []);
            });
            $('#node-input-import-messages').off('click').on('click', () => {
                $('#node-input-import-messages-file').trigger('click');
            });
            $('#node-input-import-messages-file').off('change').on('change', (event) => {
                handleImport(event.target, () => this.messages || [], (next, count) => {
                    this.messages = next;
                    updateMessageContainer(container, next);
                    RED.notify(`Imported ${count} message preset(s)`, 'success');
                });
            });
            $('#node-input-clear-messages').off('click').on('click', () => {
                if (!window.confirm('Delete all message presets?')) {
                    return;
                }
                this.messages = [];
                container.empty();
            });
        },
        oneditsave: function () {
            const messages = [];
            $('#node-input-messages-container').children('.noxy-message-row').each(function () {
                const row = $(this);
                const message = {
                    name: row.find('.node-input-message-name').val().trim(),
                    shortRef: row.find('.node-input-message-shortref').val().trim(),
                    flag: row.find('.node-input-message-flag').val() || '',
                    content: row.find('.node-input-message-content').val().trim(),
                    additionalMessages: row.find('.node-input-message-additional').val().split(',').map((value) => value.trim()).filter(Boolean)
                };
                if (message.content) {
                    messages.push(message);
                }
            });
            this.messages = messages;
        }
    };
    RED.nodes.registerType('voxta-messages', voxtaMessagesDefinition);
})();
</script>

<script type="text/html" data-template-name="voxta-messages">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
        <label for="node-input-client"><i class="fa fa-plug"></i> SignalR Client</label>
        <input type="text" id="node-input-client">
    </div>
    <div class="form-row">
        <label for="node-input-sessionId"><i class="fa fa-link"></i> Session ID</label>
        <input type="text" id="node-input-sessionId" placeholder="Optional; uses current tracked session when omitted">
    </div>
    <div class="form-row">
        <label for="node-input-text"><i class="fa fa-comment"></i> Default Text</label>
        <input type="text" id="node-input-text" placeholder="Used when no preset matches">
    </div>
    <div class="form-row">
        <label for="node-input-forwardUnmatched"><i class="fa fa-share"></i> Forward Unmatched</label>
        <input type="checkbox" id="node-input-forwardUnmatched" style="display:inline-block;width:auto;">
    </div>
    <div class="form-row" style="margin-bottom:6px;">
        <label><i class="fa fa-list"></i> Message Presets</label>
        <button type="button" class="red-ui-button" id="node-input-add-message">Add preset</button>
        <button type="button" class="red-ui-button" id="node-input-import-messages">Import</button>
        <button type="button" class="red-ui-button" id="node-input-export-messages">Export</button>
        <button type="button" class="red-ui-button" id="node-input-clear-messages">Delete all</button>
        <input type="file" id="node-input-import-messages-file" accept=".json,application/json" style="display:none;">
    </div>
    <div class="form-row">
        <div id="node-input-messages-container" style="width:100%;"></div>
    </div>
    <div class="form-tips">
        Send a plain string to forward it directly, or use a preset name/ref. Supported selectors: <code>random</code>, <code>next</code>, <code>previous</code>. Turn off unmatched forwarding to allow only preset-based output.
    </div>
</script>
