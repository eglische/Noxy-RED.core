<script type="text/javascript">
(function () {
    function promptImportMode() {
        const answer = window.prompt('Import mode: type "append" to append or "replace" to replace existing presets.', 'append');
        if (!answer) {
            return null;
        }
        const mode = answer.trim().toLowerCase();
        return mode === 'replace' ? 'replace' : mode === 'append' ? 'append' : null;
    }

    function readJsonFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const parsed = JSON.parse(reader.result);
                    if (!Array.isArray(parsed)) {
                        reject(new Error('Expected a JSON array'));
                        return;
                    }
                    resolve(parsed);
                } catch (error) {
                    reject(error);
                }
            };
            reader.onerror = () => reject(new Error('Failed to read file'));
            reader.readAsText(file);
        });
    }

    function downloadJsonFile(filename, data) {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    function handleImport(input, currentItems, onLoaded) {
        const file = input.files && input.files[0];
        if (!file) {
            return;
        }
        readJsonFile(file).then((parsed) => {
            const mode = promptImportMode();
            if (!mode) {
                RED.notify('Import cancelled', 'warning');
                input.value = '';
                return;
            }
            const next = mode === 'replace' ? parsed : [...currentItems(), ...parsed];
            onLoaded(next, parsed.length);
            input.value = '';
        }).catch((error) => {
            RED.notify(`Import failed: ${error.message}`, 'error');
            input.value = '';
        });
    }

    function updateContextContainer(container, contexts) {
        container.empty();
        contexts.forEach((context) => container.append(createContextEditor(context)));
    }

    function createContextEditor(context) {
        const row = $('<div/>', { class: 'noxy-context-row', style: 'border:1px solid #ccc;border-radius:6px;padding:10px;margin-bottom:8px;background:#fff;' });
        const line1 = $('<div/>', { style: 'display:flex;gap:8px;align-items:center;margin-bottom:6px;' }).appendTo(row);
        $('<input/>', { class: 'node-input-context-name', type: 'text', placeholder: 'Context name', style: 'flex:1;' }).val(context?.name || context?.Name || '').appendTo(line1);
        const disabledLabel = $('<label/>', { style: 'display:flex;align-items:center;gap:4px;white-space:nowrap;' }).appendTo(line1);
        $('<input/>', { class: 'node-input-context-disabled', type: 'checkbox' }).prop('checked', !!context?.disabled || !!context?.Disabled).appendTo(disabledLabel);
        $('<span/>').text('Disabled by default').appendTo(disabledLabel);
        $('<button/>', { type: 'button', class: 'red-ui-button red-ui-button-small node-input-context-remove' }).text('Remove').appendTo(line1);
        $('<textarea/>', { class: 'node-input-context-text', placeholder: 'Context text', style: 'width:100%;min-height:72px;margin-bottom:6px;' })
            .val(context?.text || context?.Text || '')
            .appendTo(row);
        $('<input/>', { class: 'node-input-context-flags', type: 'text', placeholder: 'Set flags, comma separated', style: 'width:100%;' })
            .val(Array.isArray(context?.setFlags || context?.SetFlags) ? (context.setFlags || context.SetFlags).join(', ') : '')
            .appendTo(row);
        row.on('click', '.node-input-context-remove', function () { row.remove(); });
        return row;
    }

    const voxtaContextDefinition = {
        category: 'Voxta',
        color: '#f6f7fb',
        defaults: {
            name: { value: '' },
            client: {
                value: '',
                type: 'signalr-client',
                required: true,
                validate: function (value) { return RED.nodes.node(value) != null; }
            },
            sessionId: { value: '' },
            contextKey: { value: '' },
            contextText: { value: '' },
            setFlags: { value: '' },
            disabled: { value: false },
            contexts: { value: [] }
        },
        inputs: 1,
        outputs: 1,
        icon: 'voxta.png',
        label: function () {
            return this.name || 'voxta-context';
        },
        oneditprepare: function () {
            const container = $('#node-input-contexts-container');
            updateContextContainer(container, Array.isArray(this.contexts) ? this.contexts : []);
            $('#node-input-add-context').off('click').on('click', function () {
                container.append(createContextEditor());
            });
            $('#node-input-export-contexts').off('click').on('click', () => {
                downloadJsonFile('voxta-contexts.json', this.contexts || []);
            });
            $('#node-input-import-contexts').off('click').on('click', () => {
                $('#node-input-import-contexts-file').trigger('click');
            });
            $('#node-input-import-contexts-file').off('change').on('change', (event) => {
                handleImport(event.target, () => this.contexts || [], (next, count) => {
                    this.contexts = next;
                    updateContextContainer(container, next);
                    RED.notify(`Imported ${count} context preset(s)`, 'success');
                });
            });
            $('#node-input-clear-contexts').off('click').on('click', () => {
                if (!window.confirm('Delete all context presets?')) {
                    return;
                }
                this.contexts = [];
                container.empty();
            });
        },
        oneditsave: function () {
            const contexts = [];
            $('#node-input-contexts-container').children('.noxy-context-row').each(function () {
                const row = $(this);
                const context = {
                    name: row.find('.node-input-context-name').val().trim(),
                    text: row.find('.node-input-context-text').val().trim(),
                    disabled: row.find('.node-input-context-disabled').is(':checked'),
                    setFlags: row.find('.node-input-context-flags').val().split(',').map((value) => value.trim()).filter(Boolean)
                };
                if (context.name && context.text) {
                    contexts.push(context);
                }
            });
            this.contexts = contexts;
        }
    };
    RED.nodes.registerType('voxta-context', voxtaContextDefinition);
})();
</script>

<script type="text/html" data-template-name="voxta-context">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
        <label for="node-input-client"><i class="fa fa-plug"></i> SignalR Client</label>
        <input type="text" id="node-input-client">
    </div>
    <div class="form-row">
        <label for="node-input-sessionId"><i class="fa fa-link"></i> Session ID</label>
        <input type="text" id="node-input-sessionId" placeholder="Optional; uses current tracked session when omitted">
    </div>
    <div class="form-row">
        <label for="node-input-contextKey"><i class="fa fa-key"></i> Fallback Key</label>
        <input type="text" id="node-input-contextKey" placeholder="Used when sending direct context payloads">
    </div>
    <div class="form-row">
        <label for="node-input-contextText"><i class="fa fa-align-left"></i> Fallback Text</label>
        <input type="text" id="node-input-contextText" placeholder="Used when sending direct context payloads">
    </div>
    <div class="form-row" style="margin-bottom:6px;">
        <label><i class="fa fa-book"></i> Context Presets</label>
        <button type="button" class="red-ui-button" id="node-input-add-context">Add preset</button>
        <button type="button" class="red-ui-button" id="node-input-import-contexts">Import</button>
        <button type="button" class="red-ui-button" id="node-input-export-contexts">Export</button>
        <button type="button" class="red-ui-button" id="node-input-clear-contexts">Delete all</button>
        <input type="file" id="node-input-import-contexts-file" accept=".json,application/json" style="display:none;">
    </div>
    <div class="form-row">
        <div id="node-input-contexts-container" style="width:100%;"></div>
    </div>
    <div class="form-tips">
        Send a configured context name to apply it. Use <code>name!</code> to send the same context disabled.
    </div>
</script>
