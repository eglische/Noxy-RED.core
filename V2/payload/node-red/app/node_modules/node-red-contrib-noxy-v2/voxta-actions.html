<script type="text/javascript">
(function () {
    function promptImportMode() {
        const answer = window.prompt('Import mode: type "append" to append or "replace" to replace existing presets.', 'append');
        if (!answer) {
            return null;
        }
        const mode = answer.trim().toLowerCase();
        return mode === 'replace' ? 'replace' : mode === 'append' ? 'append' : null;
    }

    function readJsonFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const parsed = JSON.parse(reader.result);
                    if (!Array.isArray(parsed)) {
                        reject(new Error('Expected a JSON array'));
                        return;
                    }
                    resolve(parsed);
                } catch (error) {
                    reject(error);
                }
            };
            reader.onerror = () => reject(new Error('Failed to read file'));
            reader.readAsText(file);
        });
    }

    function downloadJsonFile(filename, data) {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    function handleImport(input, kind, currentItems, onLoaded) {
        const file = input.files && input.files[0];
        if (!file) {
            return;
        }
        readJsonFile(file).then((parsed) => {
            const mode = promptImportMode();
            if (!mode) {
                RED.notify('Import cancelled', 'warning');
                input.value = '';
                return;
            }
            const next = mode === 'replace' ? parsed : [...currentItems(), ...parsed];
            onLoaded(next, parsed.length);
            input.value = '';
        }).catch((error) => {
            RED.notify(`Import failed: ${error.message}`, 'error');
            input.value = '';
        });
    }

    function updateActionContainer(container, actions) {
        container.empty();
        actions.forEach((action) => container.append(createActionEditor(action)));
    }

    function createArgumentEditor(argument) {
        const row = $('<div/>', { class: 'noxy-arg-row', style: 'border:1px solid #ddd;border-radius:4px;padding:8px;margin-top:6px;' });
        const top = $('<div/>', { style: 'display:flex;gap:6px;align-items:center;' }).appendTo(row);
        $('<input/>', { class: 'node-input-arg-name', type: 'text', placeholder: 'Argument name', style: 'flex:1;' }).val(argument?.name || '').appendTo(top);
        $('<select/>', { class: 'node-input-arg-type', style: 'width:120px;' })
            .append('<option value="String">String</option>')
            .append('<option value="Integer">Integer</option>')
            .val(argument?.type || 'String')
            .appendTo(top);
        const requiredLabel = $('<label/>', { style: 'display:flex;align-items:center;gap:4px;white-space:nowrap;' }).appendTo(top);
        $('<input/>', { class: 'node-input-arg-required', type: 'checkbox' }).prop('checked', argument?.required !== false).appendTo(requiredLabel);
        $('<span/>').text('Required').appendTo(requiredLabel);
        $('<button/>', { type: 'button', class: 'red-ui-button red-ui-button-small node-input-arg-remove' }).text('Remove').appendTo(top);
        $('<textarea/>', { class: 'node-input-arg-description', placeholder: 'Argument description', style: 'width:100%;margin-top:6px;min-height:54px;' })
            .val(argument?.description || '')
            .appendTo(row);
        row.on('click', '.node-input-arg-remove', function () { row.remove(); });
        return row;
    }

    function createActionEditor(action) {
        const row = $('<div/>', { class: 'noxy-action-row', style: 'border:1px solid #ccc;border-radius:6px;padding:10px;margin-bottom:8px;background:#fff;' });
        const line1 = $('<div/>', { style: 'display:flex;gap:8px;align-items:center;margin-bottom:6px;' }).appendTo(row);
        $('<input/>', { class: 'node-input-action-name', type: 'text', placeholder: 'Action name', style: 'flex:1;' }).val(action?.name || '').appendTo(line1);
        $('<input/>', { class: 'node-input-action-layer', type: 'text', placeholder: 'Layer', style: 'width:120px;' }).val(action?.layer || 'default').appendTo(line1);
        $('<select/>', { class: 'node-input-action-timing', style: 'width:210px;' })
            .append('<option value="AfterUserMessage">AfterUserMessage</option>')
            .append('<option value="BeforeAssistantMessage">BeforeAssistantMessage</option>')
            .append('<option value="AfterAssistantMessage">AfterAssistantMessage</option>')
            .append('<option value="Manual">Manual</option>')
            .append('<option value="Button">Button</option>')
            .append('<option value="AfterAnyMessage">AfterAnyMessage</option>')
            .val(action?.timing || 'AfterAssistantMessage')
            .appendTo(line1);
        $('<button/>', { type: 'button', class: 'red-ui-button red-ui-button-small node-input-action-remove' }).text('Remove').appendTo(line1);

        $('<textarea/>', { class: 'node-input-action-description', placeholder: 'Description shown to the model', style: 'width:100%;min-height:60px;margin-bottom:6px;' })
            .val(action?.description || '')
            .appendTo(row);

        const line2 = $('<div/>', { style: 'display:flex;gap:8px;align-items:center;margin-bottom:6px;' }).appendTo(row);
        $('<input/>', { class: 'node-input-action-flags', type: 'text', placeholder: 'Set flags, comma separated', style: 'flex:1;' })
            .val(Array.isArray(action?.setFlags) ? action.setFlags.join(', ') : (action?.setFlags || ''))
            .appendTo(line2);
        const cancelLabel = $('<label/>', { style: 'display:flex;align-items:center;gap:4px;white-space:nowrap;' }).appendTo(line2);
        $('<input/>', { class: 'node-input-action-cancel', type: 'checkbox' }).prop('checked', !!action?.cancelReply).appendTo(cancelLabel);
        $('<span/>').text('Cancel reply').appendTo(cancelLabel);

        $('<textarea/>', { class: 'node-input-action-secret', placeholder: 'Secret/effect text', style: 'width:100%;min-height:54px;margin-bottom:6px;' })
            .val(action?.secret || '')
            .appendTo(row);
        $('<textarea/>', { class: 'node-input-action-note', placeholder: 'Optional note', style: 'width:100%;min-height:48px;margin-bottom:6px;' })
            .val(action?.note || '')
            .appendTo(row);

        const argsWrap = $('<div/>').appendTo(row);
        $('<div/>', { style: 'font-weight:600;margin-bottom:4px;' }).text('Arguments').appendTo(argsWrap);
        const argsList = $('<div/>', { class: 'node-input-action-arguments' }).appendTo(argsWrap);
        (action?.arguments || []).forEach((argument) => argsList.append(createArgumentEditor(argument)));
        $('<button/>', { type: 'button', class: 'red-ui-button red-ui-button-small node-input-add-argument', style: 'margin-top:6px;' }).text('Add argument').appendTo(argsWrap);

        row.on('click', '.node-input-action-remove', function () { row.remove(); });
        row.on('click', '.node-input-add-argument', function () { argsList.append(createArgumentEditor()); });
        return row;
    }

    const voxtaActionsDefinition = {
        category: 'Voxta',
        color: '#f6f7fb',
        defaults: {
            name: { value: '' },
            client: {
                value: '',
                type: 'signalr-client',
                required: true,
                validate: function (value) { return RED.nodes.node(value) != null; }
            },
            sessionId: { value: '' },
            defaultMode: { value: 'add' },
            actions: { value: [] }
        },
        inputs: 1,
        outputs: 1,
        icon: 'voxta.png',
        label: function () {
            return this.name || 'voxta-actions';
        },
        oneditprepare: function () {
            const container = $('#node-input-actions-container');
            const actions = Array.isArray(this.actions) ? this.actions : [];
            updateActionContainer(container, actions);
            $('#node-input-add-action').off('click').on('click', function () {
                container.append(createActionEditor());
            });
            $('#node-input-export-actions').off('click').on('click', () => {
                downloadJsonFile('voxta-actions.json', this.actions || []);
            });
            $('#node-input-import-actions').off('click').on('click', () => {
                $('#node-input-import-actions-file').trigger('click');
            });
            $('#node-input-import-actions-file').off('change').on('change', (event) => {
                handleImport(event.target, 'action presets', () => this.actions || [], (next, count) => {
                    this.actions = next;
                    updateActionContainer(container, next);
                    RED.notify(`Imported ${count} action preset(s)`, 'success');
                });
            });
            $('#node-input-clear-actions').off('click').on('click', () => {
                if (!window.confirm('Delete all action presets?')) {
                    return;
                }
                this.actions = [];
                container.empty();
            });
        },
        oneditsave: function () {
            const actions = [];
            $('#node-input-actions-container').children('.noxy-action-row').each(function () {
                const row = $(this);
                const action = {
                    name: row.find('.node-input-action-name').val().trim(),
                    description: row.find('.node-input-action-description').val().trim(),
                    layer: row.find('.node-input-action-layer').val().trim() || 'default',
                    timing: row.find('.node-input-action-timing').val() || 'AfterAssistantMessage',
                    setFlags: row.find('.node-input-action-flags').val().split(',').map((value) => value.trim()).filter(Boolean),
                    secret: row.find('.node-input-action-secret').val().trim(),
                    note: row.find('.node-input-action-note').val().trim(),
                    cancelReply: row.find('.node-input-action-cancel').is(':checked'),
                    arguments: []
                };
                row.find('.noxy-arg-row').each(function () {
                    const argRow = $(this);
                    const name = argRow.find('.node-input-arg-name').val().trim();
                    if (!name) {
                        return;
                    }
                    action.arguments.push({
                        name,
                        type: argRow.find('.node-input-arg-type').val() || 'String',
                        description: argRow.find('.node-input-arg-description').val().trim(),
                        required: argRow.find('.node-input-arg-required').is(':checked')
                    });
                });
                if (action.name) {
                    actions.push(action);
                }
            });
            this.actions = actions;
        }
    };
    RED.nodes.registerType('voxta-actions', voxtaActionsDefinition);
})();
</script>

<script type="text/html" data-template-name="voxta-actions">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
        <label for="node-input-client"><i class="fa fa-plug"></i> SignalR Client</label>
        <input type="text" id="node-input-client">
    </div>
    <div class="form-row">
        <label for="node-input-sessionId"><i class="fa fa-link"></i> Session ID</label>
        <input type="text" id="node-input-sessionId" placeholder="Optional; uses msg.sessionId when omitted">
    </div>
    <div class="form-row">
        <label for="node-input-defaultMode"><i class="fa fa-exchange"></i> Default Mode</label>
        <select id="node-input-defaultMode">
            <option value="add">Add</option>
            <option value="remove">Remove</option>
        </select>
    </div>
    <div class="form-row" style="margin-bottom:6px;">
        <label><i class="fa fa-bolt"></i> Actions</label>
        <button type="button" class="red-ui-button" id="node-input-add-action">Add action</button>
        <button type="button" class="red-ui-button" id="node-input-import-actions">Import</button>
        <button type="button" class="red-ui-button" id="node-input-export-actions">Export</button>
        <button type="button" class="red-ui-button" id="node-input-clear-actions">Delete all</button>
        <input type="file" id="node-input-import-actions-file" accept=".json,application/json" style="display:none;">
    </div>
    <div class="form-row">
        <div id="node-input-actions-container" style="width:100%;"></div>
    </div>
    <div class="form-tips">
        Trigger with an action name to add it. Use <code>name!</code> or <code>!name</code> to remove it. Layer names work too.
    </div>
</script>
